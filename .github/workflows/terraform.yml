name: Terraform

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
  push:
    branches:
      - develop
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.9.5'
  TFLINT_VERSION: 'v0.52.0'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  ARM_USE_OIDC: 'true'

jobs:
  detect:
    name: Detect target environment
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      run_plan: ${{ steps.set.outputs.run_plan }}
      run_apply: ${{ steps.set.outputs.run_apply }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail

          TARGET=""
          RUN_PLAN="false"
          RUN_APPLY="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ github.event.inputs.target }}"
            RUN_PLAN="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RUN_PLAN="true"
            if [[ "${{ github.base_ref }}" == "develop" ]]; then
              TARGET="dev"
            elif [[ "${{ github.base_ref }}" == "main" ]]; then
              TARGET="prod"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            RUN_APPLY="true"
            if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
              TARGET="dev"
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TARGET="prod"
            fi
          fi

          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "run_plan=${RUN_PLAN}" >> "$GITHUB_OUTPUT"
          echo "run_apply=${RUN_APPLY}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Validate (${{ needs.detect.outputs.target }})
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.target != ''
    defaults:
      run:
        working-directory: environments/${{ needs.detect.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init (no backend)
        env:
          ARM_SKIP_PROVIDER_REGISTRATION: 'true'
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Run
        run: tflint --format=compact

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/${{ needs.detect.outputs.target }}
          framework: terraform
          quiet: true
          soft_fail: false

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.run_plan == 'true' && needs.detect.outputs.target != ''
    defaults:
      run:
        working-directory: environments/${{ needs.detect.outputs.target }}
    concurrency:
      group: terraform-plan-${{ needs.detect.outputs.target }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -backend-config=backend.tfbackend

      - name: Terraform Plan
        id: plan
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Upsert PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const envName = '${{ needs.detect.outputs.target }}';
            const marker = `<!-- terraform-plan-${envName} -->`;
            const path = `environments/${envName}/plan.txt`;
            const plan = fs.readFileSync(path, 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... [truncated]'
              : plan;
            const outcome = '${{ steps.plan.outcome }}';
            const body = [
              marker,
              `### Terraform Plan — ${envName} ${outcome === 'success' ? '✅' : '❌'}`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '</details>'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-dev:
    name: Apply dev
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.run_apply == 'true' && needs.detect.outputs.target == 'dev'
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -backend-config=backend.tfbackend

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve tfplan

  apply-prod:
    name: Apply prod
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.run_apply == 'true' && needs.detect.outputs.target == 'prod'
    environment: production
    defaults:
      run:
        working-directory: environments/prod
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Debug — identity and storage network rules
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "=== Signed-in identity ==="
          az account show --query "{subscription:id, tenantId:tenantId, user:user}" -o json

          echo "=== Service principal object ID ==="
          SP_OBJ_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          echo "SP object ID: $SP_OBJ_ID"

          echo "=== Role assignments for SP ==="
          az role assignment list --assignee "$SP_OBJ_ID" --all \
            --query "[].{role:roleDefinitionName, scope:scope}" -o table

          echo "=== Storage account network rules ==="
          SA_NAME=$(az storage account list \
            --resource-group rg-opella-prod-centralus-001 \
            --query "[0].name" -o tsv 2>/dev/null || echo "rg not found yet")
          if [[ "$SA_NAME" != "rg not found yet" && -n "$SA_NAME" ]]; then
            az storage account show --name "$SA_NAME" \
              --resource-group rg-opella-prod-centralus-001 \
              --query "networkRuleSet" -o json
          else
            echo "Storage account not found (first run or RG not created yet)"
          fi

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -backend-config=backend.tfbackend

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve tfplan
